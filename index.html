<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XKUMPAU ANGLERS FISHING GROUP</title>
    <style>
        :root { --primary: #003049; --accent: #f77f00; --green: #25D366; --blue: #0077b6; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #fdf0d5; color: #333; line-height: 1.6; }
        header { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center;
            color: white; padding: 60px 20px; text-align: center;
        }
        .container { max-width: 900px; margin: -30px auto 40px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Lokasi Jeti */
        .maps-btn { background: var(--blue); color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 10px; margin-bottom: 25px; font-weight: bold; font-size: 14px; }

        /* Bot Cards */
        .grid-bot { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .bot-card { border: 2px solid #eee; border-radius: 15px; padding: 20px; text-align: center; background: #fff; border-bottom: 5px solid var(--primary); }
        .price { font-size: 28px; font-weight: bold; color: var(--accent); display: block; }

        /* Menu Umpan & Servis Baru */
        .menu-title { text-align: center; color: var(--primary); margin-bottom: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .menu-item { background: #f8f9fa; padding: 15px; border-radius: 12px; border-left: 5px solid var(--accent); }
        .menu-item h4 { margin: 0; font-size: 16px; color: var(--primary); }
        .menu-item p { margin: 5px 0 0; font-size: 13px; color: #666; font-weight: bold; }

        /* Form */
        form { display: grid; gap: 15px; background: #f0f4f8; padding: 20px; border-radius: 15px; }
        label { font-weight: bold; font-size: 14px; }
        input, select, textarea { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn-submit { background: var(--accent); color: white; border: none; padding: 18px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        
        /* WhatsApp Buttons */
        .wa-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .whatsapp-btn { color: white; text-decoration: none; display: block; text-align: center; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 13px; }
        .wa-admin { background: var(--green); }
        .wa-tekong { background: #075e54; }

        @media (max-width: 600px) { .menu-grid { grid-template-columns: 1fr; } .wa-container { grid-template-columns: 1fr; } }
    </style>
</head>
