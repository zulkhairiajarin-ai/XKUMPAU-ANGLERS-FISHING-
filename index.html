<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XKUMPAU ANGLERS | Sewa Bot</title>
    <style>
        :root {
            --primary: #003049;
            --secondary: #669bbc;
            --accent: #f77f00;
            --light: #eae2b7;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            background: #fdf0d5; 
            color: #333;
        }

        header { 
            background: linear-gradient(rgba(0,48,73,0.8), rgba(0,48,73,0.8)), 
                        url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            color: white; 
            padding: 60px 20px; 
            text-align: center;
        }

        .container { 
            max-width: 900px; 
            margin: -40px auto 40px; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }

        .grid-bot {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .bot-card {
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .bot-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .bot-card img { width: 100%; border-radius: 10px; }

        form { display: grid; gap: 15px; }
        input, select, textarea { 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            font-size: 16px; 
        }

        button { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }

        button:hover { background: #d62828; }

        h2 { color: var(--primary); text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>⚓ XKUMPAU ANGLERS FISHING</h1>
    <p>Trip Memancing & Sewaan Bot No. 1 Terengganu</p>
</header>

<div class="container">
    <h2>Pilih Jentera Anda</h2>
    <div class="grid-bot">
        <div class="bot-card">
            <img src="https://images.unsplash.com/photo-1567899378494-47b22a2ca96a?auto=format&fit=crop&w=300&q=80" alt="Bot">
            <h3>Speedboat</h3>
            <p>RM500/Hari</p>
        </div>
        <div class="bot-card">
            <img src="https://images.unsplash.com/photo-1545564344-09852f5053f3?auto=format&fit=crop&w=300&q=80" alt="Bot">
            <h3>Bot Mancing</h3>
            <p>RM300/Hari</p>
        </div>
    </div>

    <hr>
    
    <h2>Borang Booking Pantas</h2>
    <form action="https://formspree.io/f/xdayqpde" method="POST">
        <input type="text" name="Nama" placeholder="Nama Penuh Anda" required>
        <input type="tel" name="WhatsApp" placeholder="No. Phone (011...)" required>
        <input type="date" name="Tarikh_Trip" required>
        
        <select name="Pilihan_Bot">
            <option value="Speedboat">Speedboat (RM500)</option>
            <option value="Bot Mancing">Bot Mancing (RM300)</option>
        </select>

        <textarea name="Nota" rows="3" placeholder="Ada permintaan khas? (Contoh: Umpan hidup, ais, dll)"></textarea>

        <button type="submit">HANTAR TEMPAHAN SEKARANG</button>
    </form>
</div>

<footer style="text-align:center; padding: 20px; color: #666;">
    &copy; 2026 XKUMPAU Anglers Fishing - Design by Gemini AI
</footer>

</body>
</html>
