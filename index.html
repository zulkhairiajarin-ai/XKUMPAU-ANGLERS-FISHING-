<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XKUMPAU ANGLERS FISHING GROUP</title>
    <style>
        :root { --primary: #003049; --accent: #f77f00; --green: #25D366; --dark-green: #128C7E; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #fdf0d5; color: #333; }
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80'); background-size: cover; background-position: center; color: white; padding: 40px 20px; text-align: center; }
        .container { max-width: 900px; margin: -20px auto 40px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .grid-bot { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .bot-card { border: 1px solid #ddd; border-radius: 10px; padding: 10px; text-align: center; background: #f9f9f9; }
        .info-box { background: #e9ecef; padding: 15px; border-radius: 15px; margin-bottom: 20px; font-size: 14px; }
        form { display: grid; gap: 12px; }
        label { font-weight: bold; font-size: 14px; color: var(--primary); }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; width: 100%; box-sizing: border-box; }
        .btn-submit { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .wa-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .whatsapp-btn { color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; }
        .wa-admin { background: var(--green); }
        .wa-tekong { background: var(--dark-green); }
    </style>
</head>
<body>

<header>
    <h1>⚓ XKUMPAU ANGLERS FISHING GROUP</h1>
    <p>Muara Gayang, Tuaran | Target: Siakap, MJ & GT</p>
</header>

<div class="container">
    <div class="grid-bot">
        <div class="bot-card"><h3>12' (5HP)</h3><b style="color:var(--accent)">RM100</b></div>
        <div class="bot-card"><h3>16' (9.8HP)</h3><b style="color:var(--accent)">RM130</b></div>
        <div class="bot-card"><h3>21' (15HP)</h3><b style="color:var(--accent)">RM160</b></div>
    </div>

    <form action="https://formspree.io/f/xdayqpde" method="POST">
        <label>Nama Penuh:</label>
        <input type="text" name="Nama" required>

        <label>Pilihan Bot:</label>
        <select name="Pilihan_Bot">
            <option value="12ft">12 Kaki (RM100)</option>
            <option value="16ft">16 Kaki (RM130)</option>
            <option value="21ft">21 Kaki (RM160)</option>
        </select>

        <label>Saiz Udang Hidup:</label>
        <select name="Saiz_Udang">
            <option value="Tiada">Tiada Udang</option>
            <option value="30sen">Saiz 30sen</option>
            <option value="50sen">Saiz 50sen</option>
            <option value="80sen">Saiz 80sen</option>
            <option value="RM1">Saiz RM1</option>
        </select>

        <label>Bilangan Udang (Berapa Pcs):</label>
        <input type="number" name="Kuantiti_Udang" placeholder="Contoh: 50">

        <label>Umpan Belanak (RM2/ekor):</label>
        <input type="number" name="Kuantiti_Belanak" placeholder="Berapa ekor?">

        <label>Nota Tambahan (Cth: Tarikh/Tekong/Umpan Mati):</label>
        <textarea name="Nota" rows="2" placeholder="Cth: Nak tekong (+RM50). Tarikh 12/5."></textarea>

        <button type="submit" class="btn-submit">HANTAR BOOKING</button>
    </form>

    <div class="wa-container">
        <a href="https://wa.me/60139365654" target="_blank" class="whatsapp-btn wa-admin">💬 ADMIN (BOOKING)</a>
        <a href="https://wa.me/60168445548" target="_blank" class="whatsapp-btn wa-tekong">🎣 TEKONG (TEKNIKAL)</a>
    </div>
</div>

</body>
</html>
