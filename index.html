<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XKUMPAU ANGLERS FISHING GROUP</title>
    <style>
        :root { --primary: #003049; --accent: #f77f00; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #fdf0d5; color: #333; }
        
        /* GAMBAR BARU - BOT MANCING */
        header { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center;
            color: white; padding: 80px 20px; text-align: center;
        }

        .container { max-width: 900px; margin: -40px auto 40px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .grid-bot { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .bot-card { border: 2px solid #eee; border-radius: 15px; padding: 20px; text-align: center; background: #fff; }
        .bot-tag { background: #0077b6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        
        form { display: grid; gap: 15px; margin-top: 20px; }
        input, select, textarea { padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; width: 100%; box-sizing: border-box; }
        button { background: var(--accent); color: white; border: none; padding: 18px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .whatsapp-btn { background: #25D366; color: white; text-decoration: none; display: block; text-align: center; padding: 15px; border-radius: 10px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>⚓ XKUMPAU ANGLERS FISHING GROUP</h1>
    <p>Muara Gayang, Tuaran - Target: Siakap, MJ & GT!</p>
</header>

<div class="container">
    <div class="grid-bot">
        <div class="bot-card">
            <span class="bot-tag">Enjin 5HP</span>
            <h3>Bot 12 Kaki</h3>
            <p>Casting Muara</p>
        </div>
        <div class="bot-card">
            <span class="bot-tag">Enjin 9.8HP</span>
            <h3>Bot 16 Kaki</h3>
            <p>Stabil & Luas</p>
        </div>
        <div class="bot-card">
            <span class="bot-tag">Enjin 15HP</span>
            <h3>Bot 21 Kaki</h3>
            <p>Trip Jauh / Family</p>
        </div>
    </div>

    <hr style="border:0; height:1px; background:#eee;">
    
    <h2 style="text-align:center; color: var(--primary);">Borang Tempahan</h2>
    <form action="https://formspree.io/f/xdayqpde" method="POST">
        <input type="text" name="Nama" placeholder="Nama Penuh" required>
        <input type="tel" name="WhatsApp" placeholder="No. WhatsApp" required>
        <input type="date" name="Tarikh" required>
        
        <select name="Pilihan_Bot" required>
            <option value="" disabled selected>Pilih Saiz Bot</option>
            <option value="5HP_12Kaki">Bot 12 Kaki (5HP)</option>
            <option value="9.8HP_16Kaki">Bot 16 Kaki (9.8HP)</option>
            <option value="15HP_21Kaki">Bot 21 Kaki (15HP)</option>
        </select>

        <textarea name="Pesanan" rows="3" placeholder="Target: Siakap/MJ/GT. Ais/Umpan?"></textarea>
        <button type="submit">HANTAR BOOKING</button>
        <a href="https://wa.me/601XXXXXXXX" class="whatsapp-btn">HUBUNGI WHATSAPP</a>
    </form>
</div>

</body>
</html>
